<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#464646">
    <meta name="description" content="Traduce catálogos XML et alii.">
    <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=42">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="index.css">
    <script src="index.js" type="module"></script>

    <title>trujamán</title>  <!-- cspell: ignore trujamán -->
</head>

<body>
    <div hidden data-element="js-dropzone" id="dropzone"><p data-placeholder="js-dropzone-text"></p></div>

    <header>
        <div data-element="js-logo" id="logo">trujamán</div>
        <div>
            <span data-placeholder="js-version-text" id="version"></span>
        </div>
    </header>

    <noscript>
        <div>¡Este navegador no permite el uso de JavaScript por lo que la aplicación no podrá funcionar!</div>
    </noscript>

    <div hidden data-element="js-filepicker" id="filepicker">
        <input data-role="js-filepicker" type="file" multiple>
        <button data-placeholder="js-default-control-text" data-element="js-default-control" type="button"></button>
    </div>

    <div data-element="js-jobs-container" id="jobs"></div>

    <template data-element="js-error-template">
        <div class="error">
            <div class="error-header" data-placeholder="js-error-header"></div>
            <div class="error-body">
                <div>
                    <span class="error-name" data-placeholder="js-error-name" hidden></span>
                    <span data-placeholder="js-error-message" hidden></span>
                </div>
                <div class="error-location" data-placeholder="js-error-location" hidden></div>
                <div class="error-details" data-placeholder="js-error-details" hidden></div>
                <div class="error-stack" data-placeholder="js-error-stack" hidden></div>
            </div>
        </div>
    </template>

    <template data-element="js-job-template">
        <div class="job">
            <div class="job-header">
                <p data-placeholder="js-job-filename-text" class="job-filename"></p>
                <button data-role="js-job-dismiss" type="button" class="job-dismisser">×</button>
            </div>
            <div data-element="js-job-debuginfo" hidden class="job-debuginfo">
                <p data-placeholder="js-job-debuginfo-text"></p>
            </div>
            <div class="job-body">
                <p data-placeholder="js-job-message-text"></p>
                <div data-element="js-job-download-dropdown" hidden class="job-download-dropdown">
                    <button data-placeholder="js-job-download-dropdown-text" type="button"></button>
                    <div data-element="js-job-formats-list" hidden class="job-formats-list"></div>
                </div>
            </div>
        </div>
    </template>

    <template data-element="js-downloadable-format-template">
        <p><span data-placeholder="js-downloadable-format-name-text" class="downloadable-format-name"></span></p>
    </template>
</body>

</html>
