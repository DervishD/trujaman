<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#464646">
    <meta name="description" content="Traduce catálogos XML et alii.">
    <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?v=42">
    <link rel="manifest" href="manifest.webmanifest">

    <link rel="stylesheet" href="index.css">
    <script src="index.js" type="module"></script>

    <title>trujamán</title>  <!-- cspell: ignore trujamán -->
</head>

<body>
    <div hidden data-element="js-dropzone" id="dropzone"><p>Suelte aquí los ficheros</p></div>

    <header data-keep-on-error>
        <div data-element="js-logo" id="logo">trujamán</div>
        <div>
            <span data-placeholder="js-version" id="version" class="monospaced">loading…</span>
        </div>
    </header>

    <noscript>
        <div>¡Este navegador no permite el uso de JavaScript por lo que la aplicación no podrá funcionar!</div>
    </noscript>

    <div hidden data-element="js-filepicker" id="filepicker">
        <input data-role="js-filepicker" type="file" multiple>
        <button data-element="js-default-control" type="button">Escoger ficheros</button>
    </div>

    <div data-element="js-jobs-container" id="jobs"></div>

    <template data-element="js-error-template" data-keep-on-error>
        <div class="error">
            <div class="error_header js-error-header"></div>
            <div class="error_message js-error-message"></div>
            <pre class="error_location js-error-location"></pre>
            <pre class="error_details js-error-details"></pre>
        </div>
    </template>

    <template data-element="js-job-template">
        <div class="job">
            <div class="job_header">
                <p data-placeholder="js-job-filename" class="job_filename"></p>
                <button data-role="js-job-dismiss" type="button" class="job_dismisser">×</button>
            </div>
            <div class="job_body">
                <p data-placeholder="js-job-message" class="job_message"></p>
                <div data-element="js-job-download-dropdown" hidden class="job_download_dropdown">
                    <button type="button">Descargar en formato…</button>
                    <div data-element="js-job-formats-list" hidden class="job_formats_list"></div>
                </div>
            </div>
        </div>
    </template>

    <template data-element="js-downloadable-format-template">
        <p><span data-placeholder="js-downloadable-format-name" class="downloadable-format-name"></span></p>
    </template>
</body>

</html>
